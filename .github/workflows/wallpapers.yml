name: Process Mobile Wallpapers

on:
  push:
    branches: ["main"]
    paths:
      - "Mobile/**"
      - "scripts/**"
      - ".github/workflows/wallpapers.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wallpapers
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade Pillow

      - name: Record original image sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          exts = {".jpg", ".jpeg", ".png", ".webp", ".avif"}
          total = 0
          count = 0
          for p in Path("Mobile").rglob("*"):
              if p.is_file() and p.suffix.lower() in exts:
                  total += p.stat().st_size
                  count += 1
          Path("/tmp/original_count").write_text(str(count))
          Path("/tmp/original_bytes").write_text(str(total))
          print(f"Original: {count} images, {total:,} bytes")
          PY

      - name: Optimize images
        env:
          WEBP_QUALITY: "95"
        run: python scripts/optimize.py

      - name: Calculate optimization savings
        run: |
          python - <<'PY'
          from pathlib import Path
          exts = {".jpg", ".jpeg", ".png", ".webp", ".avif"}
          original_count = int(Path("/tmp/original_count").read_text())
          original_bytes = int(Path("/tmp/original_bytes").read_text())

          current_bytes = 0
          current_count = 0
          for p in Path("Mobile").rglob("*"):
              if p.is_file() and p.suffix.lower() in exts:
                  current_bytes += p.stat().st_size
                  current_count += 1

          saved = max(0, original_bytes - current_bytes)
          percent = (saved / original_bytes * 100) if original_bytes else 0

          def size(n):
              units = ["B", "KB", "MB", "GB"]
              n = float(n)
              for unit in units:
                  if n < 1024 or unit == units[-1]:
                      return f"{n:.1f} {unit}"
                  n /= 1024

          summary = (
              f"Images processed: {original_count}\n"
              f"Size: {size(original_bytes)} → {size(current_bytes)}\n"
              f"Saved: {size(saved)} ({percent:.1f}%)"
          )
          Path("/tmp/optimization_summary").write_text(summary)
          print(summary)
          with open("/tmp/optimization_summary_env", "w") as f:
              f.write(f"OPT_COUNT={original_count}\n")
              f.write(f"OPT_BEFORE={size(original_bytes)}\n")
              f.write(f"OPT_AFTER={size(current_bytes)}\n")
              f.write(f"OPT_SAVED={size(saved)}\n")
              f.write(f"OPT_PERCENT={percent:.1f}%\n")
          PY
          cat /tmp/optimization_summary_env >> "$GITHUB_ENV"

      # Disabled by default: content understanding requires an AI model.
      # Run manually with:
      #   python scripts/rename.py --dry-run
      # before enabling automatic renaming.
      #
      # - name: Rename images
      #   run: python scripts/rename.py

      - name: Generate API
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/generate_api.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mobile api
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: optimize mobile wallpapers" -m "$(cat <<EOF
          $OPT_COUNT images processed
          $OPT_BEFORE → $OPT_AFTER
          Saved $OPT_SAVED ($OPT_PERCENT)
          EOF
          )"
            git push
          fi
