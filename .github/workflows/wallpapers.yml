name: Process Wallpapers

on:
  push:
    branches: ["main"]
    paths:
      - "Mobile/**"
      - "Desktop/**"
      - "scripts/**"
      - ".github/workflows/wallpapers.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallpapers
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade Pillow

      - name: Record image sizes before optimization
        run: |
          python - <<'PY'
          from pathlib import Path
          exts = {".jpg", ".jpeg", ".png", ".webp", ".avif"}
          total = count = mobile = desktop = 0
          for root in (Path("Mobile"), Path("Desktop")):
              if not root.exists():
                  continue
              for p in root.rglob("*"):
                  if p.is_file() and p.suffix.lower() in exts:
                      count += 1
                      total += p.stat().st_size
                      if root.name == "Mobile":
                          mobile += 1
                      else:
                          desktop += 1
          Path("/tmp/before_bytes").write_text(str(total))
          Path("/tmp/before_count").write_text(str(count))
          Path("/tmp/mobile_count").write_text(str(mobile))
          Path("/tmp/desktop_count").write_text(str(desktop))
          PY

      - name: Optimize Mobile and Desktop wallpapers
        env:
          WEBP_QUALITY: "95"
        run: python scripts/optimize.py

      - name: Rename Mobile and Desktop wallpapers
        run: python scripts/rename.py

      - name: Calculate optimization statistics
        run: |
          python - <<'PY'
          from pathlib import Path
          exts = {".jpg", ".jpeg", ".png", ".webp", ".avif"}
          before = int(Path("/tmp/before_bytes").read_text())
          count = int(Path("/tmp/before_count").read_text())
          mobile = int(Path("/tmp/mobile_count").read_text())
          desktop = int(Path("/tmp/desktop_count").read_text())
          after = sum(
              p.stat().st_size
              for root in (Path("Mobile"), Path("Desktop"))
              if root.exists()
              for p in root.rglob("*")
              if p.is_file() and p.suffix.lower() in exts
          )
          saved = max(0, before - after)
          percent = saved / before * 100 if before else 0

          def human(n):
              n = float(n)
              for unit in ("B", "KB", "MB", "GB", "TB"):
                  if n < 1024 or unit == "TB":
                      return f"{n:.1f} {unit}"
                  n /= 1024

          with open("/tmp/optimization_env", "w") as f:
              f.write(f"OPT_COUNT={count}\n")
              f.write(f"OPT_BEFORE={human(before)}\n")
              f.write(f"OPT_AFTER={human(after)}\n")
              f.write(f"OPT_SAVED={human(saved)}\n")
              f.write(f"OPT_PERCENT={percent:.1f}%\n")
              f.write(f"OPT_MOBILE={mobile}\n")
              f.write(f"OPT_DESKTOP={desktop}\n")
          print(f"{count} images: {human(before)} -> {human(after)}; saved {human(saved)} ({percent:.1f}%)")
          PY
          cat /tmp/optimization_env >> "$GITHUB_ENV"

      - name: Generate Mobile API
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/generate_api.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mobile Desktop api
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: optimize and rename wallpapers" -m "$(cat <<EOF
          $OPT_COUNT images processed
          $OPT_BEFORE → $OPT_AFTER
          Saved $OPT_SAVED ($OPT_PERCENT)

          Mobile: $OPT_MOBILE images
          Desktop: $OPT_DESKTOP images

          Mobile wallpapers are included in the API.
          Desktop wallpapers are optimized and renamed only.
          EOF
          )"
            git push
          fi
