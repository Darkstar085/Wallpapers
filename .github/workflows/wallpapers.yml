name: Process Mobile Wallpapers

on:
  push:
    branches: ["main"]
    paths:
      - "Mobile/**"
      - "scripts/**"
      - ".github/workflows/wallpapers.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wallpapers
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade Pillow

      - name: Optimize images
        env:
          WEBP_QUALITY: "95"
        run: python scripts/optimize.py

      - name: Generate API
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/generate_api.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mobile api
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: optimize mobile wallpapers and update API"
            git push
          fi
